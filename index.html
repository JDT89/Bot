<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Primary Meta Tags -->
    <title>AstraBot - Level up your Discord server</title>
    <meta name="title" content="AstraBot - Level up your Discord server" />
    <meta name="description" content="The modular mod, log, and fun bot that fits your vibe. Smart moderation, utility commands, leveling, and more." />
    <meta name="keywords" content="Discord bot, moderation bot, Discord server management, auto-mod, leveling bot, utility bot" />
    <meta name="author" content="AstraBot" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://astrabot.gg/" />
    <meta property="og:title" content="AstraBot - Level up your Discord server" />
    <meta property="og:description" content="The modular mod, log, and fun bot that fits your vibe. Smart moderation, utility commands, leveling, and more." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="AstraBot" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://astrabot.gg/" />
    <meta property="twitter:title" content="AstraBot - Level up your Discord server" />
    <meta property="twitter:description" content="The modular mod, log, and fun bot that fits your vibe. Smart moderation, utility commands, leveling, and more." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    
    <!-- Disable tap highlight on mobile -->
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Format detection -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Status bar style for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AstraBot" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- No-JS fallback -->
    <noscript>
      <style>
        body {
          background: #0B0C10;
          color: #F5F7FF;
          font-family: system-ui, -apple-system, sans-serif;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          margin: 0;
          padding: 20px;
          text-align: center;
        }
        .noscript-content {
          max-width: 500px;
        }
        h1 {
          color: #B8FF2C;
          margin-bottom: 1rem;
        }
        p {
          color: #A7ACB8;
          line-height: 1.6;
        }
      </style>
      <div class="noscript-content">

        <p>AstraBot's website requires JavaScript to function. Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>
