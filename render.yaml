# render.yaml — Render Static Site configuration
# Deploy at: https://dashboard.render.com/new/static
services:
  - type: web
    name: economy-bot-website
    env: static
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /src/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/images/*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /home
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
