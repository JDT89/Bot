<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7289ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FAA61A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f2f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b90a0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Coin icon with gear -->
  <circle cx="40" cy="40" r="28" fill="url(#coinGradient)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="40" cy="40" r="24" fill="none" stroke="#f0f2f5" stroke-width="2" opacity="0.3"/>
  <text x="40" y="52" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="32" font-weight="700" fill="#f0f2f5" text-anchor="middle">⚙</text>
  
  <!-- CoinHub text -->
  <text x="80" y="48" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="32" font-weight="800" fill="url(#textGradient)" letter-spacing="-1">
    CoinHub
  </text>
  
  <!-- Accent line under text -->
  <rect x="80" y="54" width="100" height="3" fill="url(#coinGradient)" rx="1.5" opacity="0.6"/>
</svg>
