<svg width="200" height="56" viewBox="0 0 200 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAA61A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4941a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7983f5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Coin Icon -->
  <g filter="url(#glow)">
    <!-- Outer circle with gradient -->
    <circle cx="28" cy="28" r="22" fill="url(#coinGradient)" stroke="#d4941a" stroke-width="1.5"/>
    
    <!-- Inner decorative ring -->
    <circle cx="28" cy="28" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Dollar/Currency symbol -->
    <path d="M 28 14 L 28 42 M 22 18 Q 22 14 28 14 Q 34 14 34 18 Q 34 22 28 22 M 28 22 Q 22 22 22 26 Q 22 30 28 30 M 28 30 Q 34 30 34 34 Q 34 38 28 38 Q 22 38 22 34" 
          stroke="rgba(0,0,0,0.6)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Shine effect -->
    <ellipse cx="22" cy="20" rx="6" ry="10" fill="rgba(255,255,255,0.4)" opacity="0.6"/>
  </g>
  
  <!-- Text: CoinHub -->
  <text x="60" y="38" 
        font-family="'Bricolage Grotesque', 'Space Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#f0f2f5"
        letter-spacing="-0.5">
    Coin<tspan fill="url(#textGradient)">Hub</tspan>
  </text>
</svg>
