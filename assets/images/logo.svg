<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <!-- Modern gradient for the coin stack -->
    <linearGradient id="coinStackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAA61A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FEE75C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FAA61A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7289DA;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f2f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e2e8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon: Modern coin stack design -->
  <g filter="url(#shadow)">
    <!-- Back coin -->
    <ellipse cx="30" cy="38" rx="18" ry="5" fill="url(#coinStackGradient)" opacity="0.6"/>
    <ellipse cx="30" cy="38" rx="15" ry="4" fill="none" stroke="#0b0d0f" stroke-width="1.5"/>
    
    <!-- Middle coin -->
    <ellipse cx="30" cy="30" rx="18" ry="5" fill="url(#coinStackGradient)" opacity="0.8"/>
    <ellipse cx="30" cy="30" rx="15" ry="4" fill="none" stroke="#0b0d0f" stroke-width="1.5"/>
    
    <!-- Front coin (main) -->
    <ellipse cx="30" cy="22" rx="18" ry="5" fill="url(#coinStackGradient)"/>
    <ellipse cx="30" cy="22" rx="15" ry="4" fill="none" stroke="#0b0d0f" stroke-width="1.5"/>
    
    <!-- Coin symbol on front coin -->
    <text x="30" y="26" font-family="'Space Grotesk', Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0d0f" text-anchor="middle">$</text>
    
    <!-- Sparkle effects -->
    <circle cx="48" cy="16" r="2" fill="#FEE75C" filter="url(#glow)"/>
    <circle cx="12" cy="24" r="1.5" fill="#FEE75C" filter="url(#glow)"/>
    <circle cx="45" cy="35" r="1.5" fill="#FAA61A" opacity="0.8"/>
  </g>
  
  <!-- Brand text with modern styling -->
  <text x="65" y="27" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="24" font-weight="800" fill="url(#textGradient)" letter-spacing="-0.5">
    Coin
  </text>
  <text x="112" y="27" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="24" font-weight="800" fill="url(#accentGradient)" letter-spacing="-0.5">
    Hub
  </text>
  
  <!-- Tagline -->
  <text x="65" y="40" font-family="'Space Grotesk', Arial, sans-serif" font-size="8" font-weight="500" fill="#8b90a0" letter-spacing="1.2">
    ECONOMY BOT
  </text>
  
  <!-- Decorative accent -->
  <rect x="65" y="44" width="70" height="1.5" fill="url(#accentGradient)" rx="0.75" opacity="0.5"/>
</svg>
